<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="460" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Hardware Patch Fitting Silhouette -->
